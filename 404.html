<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page Not Found | Potter Academy</title>
		<link rel="icon" href="/Favicon.webp" type="image/webp" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@400;700&family=Fraunces:ital,wght@0,400..700;1,400..700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--green: #39ff14;
				--bg-dark: #0a0a0a;
				--text-light: #e8e8e0;
				--font-display: "Archivo", sans-serif;
				--font-body: "JetBrains Mono", monospace;
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: var(--font-body);
				background: var(--bg-dark);
				color: var(--text-light);
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 2rem;
				line-height: 1.7;
			}
			h1 {
				font-family: var(--font-display);
				font-size: 8rem;
				font-weight: 900;
				color: var(--green);
				line-height: 1;
				margin-bottom: 1rem;
			}
			h2 {
				font-family: var(--font-display);
				font-size: 1.5rem;
				text-transform: uppercase;
				letter-spacing: -0.02em;
				margin-bottom: 1.5rem;
			}
			p {
				opacity: 0.7;
				max-width: 400px;
				margin-bottom: 2rem;
			}
			a {
				font-family: var(--font-display);
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				background: var(--green);
				color: var(--bg-dark);
				padding: 0.8rem 2rem;
				text-decoration: none;
				text-transform: uppercase;
				font-weight: 800;
				font-size: 0.9rem;
				transition: all 0.2s;
			}
			a:hover {
				transform: translate(-2px, -2px);
				box-shadow: 4px 4px 0 var(--text-light);
			}
		</style>
	</head>
	<body>
		<h1>404</h1>
		<h2>Page Not Found</h2>
		<p>
			This page doesn't exist or has been moved. Let's get you back to
			creating art.
		</p>
		<a href="/">← Back to Home</a>
	</body>
</html>
